<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="72%" cy="8%" r="90%">
      <stop offset="0%" stop-color="#14224a"/>
      <stop offset="55%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#060a16"/>
    </radialGradient>
    <radialGradient id="globe" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#1c4f8f"/>
      <stop offset="100%" stop-color="#0b2247"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#4a8bff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a8bff" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- глобус -->
  <g transform="translate(300 315)">
    <circle r="250" fill="url(#atmo)"/>
    <circle r="235" fill="url(#globe)"/>
    <!-- сетка -->
    <g fill="none" stroke="#2f5ea0" stroke-opacity="0.35" stroke-width="1.5">
      <ellipse rx="235" ry="80"/>
      <ellipse rx="235" ry="160"/>
      <ellipse rx="80" ry="235"/>
      <ellipse rx="160" ry="235"/>
      <circle r="235"/>
    </g>
    <!-- условные материки -->
    <g fill="#9ec5ff" fill-opacity="0.28">
      <path d="M-120,-150 q40,-30 90,-10 q30,40 -10,80 q-60,30 -110,0 q-20,-40 40,-70z"/>
      <path d="M20,10 q60,-20 90,30 q10,60 -40,110 q-50,20 -70,-30 q-20,-70 20,-110z"/>
    </g>
    <!-- выделенная страна (истинный размер) -->
    <path d="M60,-140 q35,-15 60,15 q10,45 -20,75 q-45,20 -60,-15 q-15,-55 20,-75z"
          fill="#ffd24a" fill-opacity="0.8" stroke="#ff7a1a" stroke-width="3"/>
  </g>

  <!-- текст -->
  <g transform="translate(640 250)" fill="#eaf1ff" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
    <text x="0" y="0" font-size="82" font-weight="800" letter-spacing="-1">Моя Планета</text>
    <text x="0" y="70" font-size="32" font-weight="500" fill="#9db0d6">Истинные размеры стран</text>
    <text x="0" y="112" font-size="32" font-weight="500" fill="#9db0d6">на вращающемся 3D-глобусе</text>
    <text x="4" y="196" font-size="26" font-weight="700" fill="#ff8a3d">my-planet-earth.ru</text>
  </g>
</svg>
