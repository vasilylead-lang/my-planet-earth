<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- океан: подсветка сверху-слева, как в приложении -->
    <radialGradient id="ocean" cx="36%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#1c4f8f"/>
      <stop offset="60%" stop-color="#123a6b"/>
      <stop offset="100%" stop-color="#0a2247"/>
    </radialGradient>
    <!-- заливка России: акцент приложения -->
    <linearGradient id="ru" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd75a"/>
      <stop offset="100%" stop-color="#ff9d33"/>
    </linearGradient>
    <!-- атмосферное свечение по краю -->
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#4a8bff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6fa8ff" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="disc">
      <circle cx="32" cy="32" r="29"/>
    </clipPath>
  </defs>

  <!-- тёмный фон -->
  <rect width="64" height="64" rx="14" fill="#070b18"/>

  <!-- шар океана -->
  <circle cx="32" cy="32" r="29" fill="url(#ocean)"/>

